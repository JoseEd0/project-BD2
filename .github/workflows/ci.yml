name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Motor (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check
      - name: Mypy
        run: mypy
      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        run: npm ci
      - name: Tipos y bundle
        run: npm run build
      - name: Tests
        run: npm test

  compose:
    name: Docker compose
    runs-on: ubuntu-latest
    env:
      WEB_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Construir y levantar
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: La demo quedó cargada
        run: docker compose logs demo | grep -q "filas de la muestra ESCI"
      - name: El API responde a través de nginx
        run: curl --fail --silent --show-error "$WEB_URL/api/health"
      - name: Una búsqueda de texto a través de nginx
        run: |
          curl --fail --silent --show-error "$WEB_URL/api/query" \
            --header "content-type: application/json" \
            --data "{\"sql\": \"SELECT titulo FROM catalogo WHERE MATCH(texto, 'funda AND iphone') LIMIT 3;\"}" \
            | python3 -c "import json, sys; assert len(json.load(sys.stdin)['rows']) == 3"
      - name: Las librerías multimedia cargan en la imagen del motor
        run: |
          docker compose exec -T api python -c \
            "import numpy, faiss, cv2, librosa; cv2.SIFT_create(); librosa.feature.mfcc(y=numpy.zeros(22050, 'float32'), sr=22050)"
      - name: Con el API en marcha, la demo no se vuelve a cargar
        run: docker compose run --rm demo | grep -q "la demo no se vuelve a cargar"
      - name: El perfil bench mide GiST contra su PostgreSQL
        run: |
          docker compose --profile bench run --rm bench python -m benchmarks.spatial_benchmark \
            --sizes 1000 --queries 5 --output /tmp/espacial \
            | grep "GiST (PostgreSQL) | radio 1 km" | grep -q "coinciden_con_el_motor=5/5"
      - name: pgvector en el PostgreSQL de referencia
        run: |
          docker compose --profile bench exec -T postgres psql --username postgres \
            --dbname minigestor_bench --command "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Registro de los servicios
        if: failure()
        run: docker compose --profile bench logs
      - name: Apagar
        if: always()
        run: docker compose --profile bench down --volumes
