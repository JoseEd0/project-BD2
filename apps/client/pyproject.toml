[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minigestor-client"
version = "0.1.0"
description = "Cliente tipado del API REST del minigestor"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/minigestor_client"]
