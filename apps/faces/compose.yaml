# Rostros (opción D): su API, que es la única que habla con el gestor, y su interfaz, la PWA
# de la cámara (apps/faces/web). Se incluye desde el compose.yaml raíz; las redes data y
# cache están declaradas allí.
#
# LFW (`python -m faces lfw --salida data/datasets/lfw`) se monta de solo lectura: la carga
# (`faces-seed`) saca de ahí las personas públicas de «¿A qué famoso te pareces?» y el API
# sirve sus fotos.

services:
  faces-api:
    extends: { file: ../../deploy/app.compose.yaml, service: api }
    build:
      args:
        APP_DIR: faces
    image: minigestor-faces-api
    environment: &faces-environment
      FACES_ENGINE_URL: http://engine:8000
      FACES_ENGINE_KEY: ${FACES_ENGINE_KEY:-}
      FACES_MIGRATION_KEY: ${FACES_MIGRATION_KEY:-}
      FACES_LOG_LEVEL: ${FACES_LOG_LEVEL:-INFO}
      # Los modelos que apps/faces/docker-build.sh dejó en la imagen al construirla.
      FACES_MODELS_DIR: /opt/app/models
      FACES_RETENTION_DAYS: ${FACES_RETENTION_DAYS:-30}
      FACES_ENROLLMENT_TTL_SECONDS: ${FACES_ENROLLMENT_TTL_SECONDS:-900}
      FACES_MAX_UPLOAD_BYTES: ${FACES_MAX_UPLOAD_BYTES:-10485760}
      FACES_ANALYSIS_WORKERS: ${FACES_ANALYSIS_WORKERS:-2}
      # Los rastros del reconocimiento en vivo, compartidos por las réplicas; la base 1 para no
      # mezclarse con la caché de otra app. Si Redis no responde, se reconoce sin rastros.
      FACES_REDIS_URL: ${FACES_REDIS_URL:-redis://redis:6379/1}
      FACES_STREAM_MAX_FPS: ${FACES_STREAM_MAX_FPS:-15}
      FACES_STREAM_MAX_CONNECTIONS: ${FACES_STREAM_MAX_CONNECTIONS:-16}
      FACES_DATA_DIR: /app/data/datasets
      FACES_LOOKALIKE_COUNT: ${FACES_LOOKALIKE_COUNT:-5}
    volumes:
      - ${MINIGESTOR_DATASETS_DIR:-../../data/datasets}:/app/data/datasets:ro
    # Cada pipeline de análisis carga YuNet y SFace (37 MiB en disco) y decodifica fotos de
    # celular de hasta 50 MP.
    mem_limit: ${FACES_API_MEMORY:-1g}
    networks: [data, faces, cache]
    depends_on:
      engine:
        condition: service_healthy
      redis:
        condition: service_healthy

  faces-web:
    extends: { file: ../../deploy/app.compose.yaml, service: web }
    build:
      args:
        APP_DIR: faces/web
    image: minigestor-faces-web
    environment:
      API_UPSTREAM: http://faces-api:8000
      # La PWA pide la cámara; el micrófono y la ubicación, nunca.
      WEB_PERMISSIONS_POLICY: camera=(self), microphone=(), geolocation=()
      # Una foto de 10 MiB (FACES_MAX_UPLOAD_BYTES) más el sobre del multipart.
      API_MAX_BODY_SIZE: ${FACES_WEB_MAX_BODY_SIZE:-11m}
      # Cada foto cuesta de 20 a 100 ms de CPU en la API: menos peticiones por IP que el resto.
      # El WebSocket de la cámara es una sola petición, la que abre la conexión.
      API_RATE_LIMIT: ${FACES_WEB_RATE_LIMIT:-5r/s}
      API_RATE_BURST: ${FACES_WEB_RATE_BURST:-20}
    ports:
      - ${FACES_WEB_PORT:-8104}:8080
      - ${FACES_WEB_TLS_PORT:-8404}:8443
    networks: [faces]
    depends_on:
      faces-api:
        condition: service_healthy

  faces-seed:
    extends: { file: ../../deploy/app.compose.yaml, service: seed }
    profiles: [seed]
    image: minigestor-faces-api
    environment:
      <<: *faces-environment
      FACES_SEED_WORKERS: ${FACES_SEED_WORKERS:-2}
    volumes:
      - ${MINIGESTOR_DATASETS_DIR:-../../data/datasets}:/app/data/datasets:ro
    # Dos procesos con YuNet y SFace y las fotos de LFW (250 x 250) que van analizando.
    mem_limit: ${FACES_SEED_MEMORY:-2g}
    networks: [data]
    depends_on:
      faces-api:
        condition: service_healthy

  faces-tunnel:
    extends: { file: ../../deploy/app.compose.yaml, service: tunnel }
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--url", "http://faces-web:8080"]
    networks: [faces]
    depends_on:
      faces-web:
        condition: service_healthy

networks:
  faces: {}
