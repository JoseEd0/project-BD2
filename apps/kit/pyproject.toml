[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minigestor-kit"
version = "0.1.0"
description = "Lo común de los servicios de la Parte 5: configuración, logs, salud, errores y descargas"
requires-python = ">=3.11"
dependencies = [
    "minigestor-client",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    # Todo servicio corre sobre uvicorn en su imagen (`deploy/service/Dockerfile`).
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
minigestor-client = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/appkit"]
