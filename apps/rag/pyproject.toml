[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minigestor-rag"
version = "0.1.0"
description = "RAG sobre papers: corpus de arXiv con texto por página y fragmentos"
requires-python = ">=3.11"
dependencies = ["pypdf>=6.0"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
