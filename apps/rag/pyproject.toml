[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minigestor-rag"
version = "0.1.0"
description = "RAG sobre papers: corpus de arXiv, ingesta en el gestor y recuperación híbrida"
requires-python = ">=3.11"
dependencies = [
    "minigestor-kit",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "pypdf>=6.0",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[tool.uv.sources]
minigestor-kit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
