# La tienda (opción B): su API sin estado, su interfaz, su carga inicial y su túnel, montados
# sobre lo común de deploy/app.compose.yaml (ver apps/README.md, «Desplegar una app»).
#
# El dataset (`python -m shop.dataset prepare`, en data/datasets/amazon_musical_instruments)
# se monta de solo lectura en la carga en la misma ruta que en el gestor, /app/data/datasets,
# que ya está entre sus MINIGESTOR_IMPORT_DIRS: la columna `imagen` guarda esa ruta y el
# gestor abre las fotos para SIFT.

services:
  shop-api:
    extends: { file: ../../deploy/app.compose.yaml, service: api }
    build:
      args:
        APP_DIR: shop
    image: minigestor-shop-api
    environment: &shop-environment
      SHOP_ENGINE_URL: http://engine:8000
      SHOP_ENGINE_KEY: ${SHOP_ENGINE_KEY:-}
      SHOP_MIGRATION_KEY: ${SHOP_MIGRATION_KEY:-}
      SHOP_LOG_LEVEL: ${SHOP_LOG_LEVEL:-INFO}
      # CLIP en ONNX, horneado en la imagen por apps/shop/docker-build.sh.
      SHOP_MODELS_DIR: /opt/app/models
      # La caché de recomendaciones; si Redis no responde, el API contesta sin ella.
      SHOP_REDIS_URL: ${SHOP_REDIS_URL:-redis://redis:6379/0}
      SHOP_CACHE_TTL_SECONDS: ${SHOP_CACHE_TTL_SECONDS:-600}
      # Las fotos de los productos, que el API sirve desde el dataset (de solo lectura).
      SHOP_DATA_DIR: /app/data/datasets
    volumes:
      - ${MINIGESTOR_DATASETS_DIR:-../../data/datasets}:/app/data/datasets:ro
    # Con las dos torres de CLIP cargadas, el API ocupa unos 640 MiB (medido).
    mem_limit: ${SHOP_API_MEMORY:-2g}
    networks: [data, shop, cache]
    depends_on:
      engine:
        condition: service_healthy
      redis:
        condition: service_healthy

  shop-web:
    extends: { file: ../../deploy/app.compose.yaml, service: web }
    build:
      args:
        APP_DIR: shop/web
    image: minigestor-shop-web
    environment:
      API_UPSTREAM: http://shop-api:8000
      # Una ficha pide decenas de fotos a la vez (cada una por /api), y una foto de celular
      # para buscar pesa más que 1 MB aunque la interfaz la reduzca: el API la acepta hasta 8 MiB.
      API_RATE_LIMIT: ${SHOP_WEB_RATE_LIMIT:-60r/s}
      API_RATE_BURST: ${SHOP_WEB_RATE_BURST:-200}
      API_MAX_BODY_SIZE: 9m
      # «Usar mi ubicación» para el stock cercano, y las teselas del mapa de OpenStreetMap.
      WEB_PERMISSIONS_POLICY: camera=(), microphone=(), geolocation=(self)
      WEB_IMG_SOURCES: https://tile.openstreetmap.org
    ports:
      - ${SHOP_WEB_PORT:-8102}:8080
      - ${SHOP_WEB_TLS_PORT:-8402}:8443
    networks: [shop]
    depends_on:
      shop-api:
        condition: service_healthy

  shop-seed:
    extends: { file: ../../deploy/app.compose.yaml, service: seed }
    profiles: [seed]
    image: minigestor-shop-api
    environment:
      <<: *shop-environment
      SHOP_DATA_DIR: /app/data/datasets
      # La caché de embeddings de CLIP vive en el tmpfs del contenedor: si el gestor ya
      # tiene `shop_clip`, una carga repetida no los vuelve a calcular.
      SHOP_EMBEDDINGS_DIR: /tmp/clip-embeddings
    volumes:
      - ${MINIGESTOR_DATASETS_DIR:-../../data/datasets}:/app/data/datasets:ro
    mem_limit: ${SHOP_SEED_MEMORY:-3g}
    networks: [data]
    depends_on:
      shop-api:
        condition: service_healthy

  shop-tunnel:
    extends: { file: ../../deploy/app.compose.yaml, service: tunnel }
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--url", "http://shop-web:8080"]
    networks: [shop]
    depends_on:
      shop-web:
        condition: service_healthy

networks:
  shop: {}
