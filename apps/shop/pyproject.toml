[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minigestor-shop"
version = "0.1.0"
description = "Tienda con recomendaciones de la Parte 5 (opción B): dataset, catálogo y recomendador"
requires-python = ">=3.11"
dependencies = [
    "minigestor-kit",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "pillow>=11",
    # La foto de `POST /busqueda/foto` llega como multipart/form-data.
    "python-multipart>=0.0.9",
    "redis>=5.2",
    "tokenizers>=0.20",
]

[tool.uv.sources]
minigestor-kit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/shop"]
