name: minigestor

x-engine: &engine
  image: minigestor-api
  volumes:
    - minigestor-data:/data

services:
  demo:
    <<: *engine
    # Usa la imagen que construye `api`: si la construyeran los dos a la vez, chocarían
    # al etiquetarla.
    pull_policy: never
    command: ["python", "/app/demos/poblar_ecommerce.py", "--data-dir", "/data", "--solo-si-vacia"]
    restart: "no"

  api:
    <<: *engine
    build:
      context: .
      target: engine
    environment:
      MINIGESTOR_CORS_ORIGINS: http://localhost:${MINIGESTOR_WEB_PORT:-8080}
    ports:
      - ${MINIGESTOR_API_PORT:-8000}:8000
    depends_on:
      demo:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    image: minigestor-web
    ports:
      - ${MINIGESTOR_WEB_PORT:-8080}:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    profiles: [bench]
    build: ./docker/postgres
    image: minigestor-postgres
    environment:
      POSTGRES_DB: minigestor_bench
      # No publica ningún puerto: solo los contenedores del compose llegan a él, así que no
      # hace falta una contraseña que guardar.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres", "--dbname", "minigestor_bench"]
      interval: 5s
      timeout: 3s
      retries: 10

  bench:
    profiles: [bench]
    build:
      context: .
      target: bench
    image: minigestor-bench
    environment:
      BENCH_POSTGRES_DSN: host=postgres dbname=minigestor_bench user=postgres
    volumes:
      - ./benchmarks:/app/benchmarks
      - ${MINIGESTOR_DATASETS_DIR:-./data/datasets}:/app/data/datasets
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  minigestor-data:
