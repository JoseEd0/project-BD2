name: minigestor

# El gestor es un servicio con estado en una red interna; cada aplicación de la Parte 5 es
# un producto aparte, con su API y su interfaz, en su propio compose y su propio puerto.
# Las redes y el volumen compartidos se declaran solo aquí.
include:
  - deploy/example/compose.yaml
  - apps/shop/compose.yaml
  - apps/faces/compose.yaml
  - apps/copyright/compose.yaml
  - apps/rag/compose.yaml

x-engine: &engine
  image: minigestor-api
  volumes:
    - minigestor-data:/data
    # Las fotos y pistas de la Parte 4 (ver `benchmarks/multimedia/README.md`). Si no están
    # descargadas, la demo no carga sus tablas y lo demás funciona igual.
    - ${MINIGESTOR_DATASETS_DIR:-./data/datasets}:/app/data/datasets:ro
  networks: [data]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  demo:
    <<: *engine
    # Usa la imagen que construye `engine`: si la construyeran los dos a la vez, chocarían
    # al etiquetarla.
    pull_policy: never
    command: ["python", "/app/demos/poblar_ecommerce.py", "--data-dir", "/data", "--solo-si-vacia"]
    restart: "no"

  # El gestor: la única réplica con estado. No publica ningún puerto y su red es interna:
  # solo la consola y las API de las aplicaciones llegan a él, cada una con su clave.
  engine:
    <<: *engine
    build:
      context: .
      target: engine
    environment:
      MINIGESTOR_CORS_ORIGINS: http://localhost:${MINIGESTOR_WEB_PORT:-8080}
      # Vacía, el gestor queda abierto (lo avisa en su log). `python -m tools.compose_keys`
      # la arma en `.env` con la clave de la consola y las de cada aplicación.
      MINIGESTOR_API_KEYS: ${MINIGESTOR_API_KEYS:-}
      MINIGESTOR_LOG_LEVEL: ${MINIGESTOR_LOG_LEVEL:-INFO}
    mem_limit: ${MINIGESTOR_ENGINE_MEMORY:-4g}
    # El apagado espera a las peticiones en curso (API_DRAIN_SECONDS) y después, con sus
    # sentencias canceladas, a que salgan (shutdown_grace_seconds) antes de cerrar el motor.
    stop_grace_period: 20s
    depends_on:
      demo:
        condition: service_completed_successfully
    restart: unless-stopped

  # La consola del gestor de las Partes 1 a 4: la puerta de administración, con la clave
  # `admin` de la consola que pone su nginx.
  console:
    build: ./frontend
    image: minigestor-console
    environment:
      API_UPSTREAM: http://engine:8000
      CONSOLE_API_KEY: ${MINIGESTOR_CONSOLE_KEY:-}
    ports:
      - ${MINIGESTOR_WEB_PORT:-8080}:8080
    networks: [data, console]
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${MINIGESTOR_CONSOLE_MEMORY:-128m}
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

  # La caché de las aplicaciones: sin disco (ni RDB ni AOF), con tope de memoria y LRU.
  redis:
    image: redis:${REDIS_VERSION:-8.8.4-alpine}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    user: redis
    networks: [cache]
    read_only: true
    tmpfs:
      - /data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${REDIS_MEMORY:-320m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    profiles: [bench]
    build: ./deploy/postgres
    image: minigestor-postgres
    environment:
      POSTGRES_DB: minigestor_bench
      # No publica ningún puerto: solo los contenedores del compose llegan a él, así que no
      # hace falta una contraseña que guardar.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres", "--dbname", "minigestor_bench"]
      interval: 5s
      timeout: 3s
      retries: 10

  bench:
    profiles: [bench]
    build:
      context: .
      target: bench
    image: minigestor-bench
    environment:
      BENCH_POSTGRES_DSN: host=postgres dbname=minigestor_bench user=postgres
    volumes:
      - ./benchmarks:/app/benchmarks
      - ${MINIGESTOR_DATASETS_DIR:-./data/datasets}:/app/data/datasets
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # Internas: sin salida a Internet ni puertos publicables. El gestor no se alcanza desde el
  # anfitrión aunque alguien le añada un `ports:`.
  data:
    internal: true
  cache:
    internal: true
  # La de la consola, para publicar su puerto.
  console: {}

volumes:
  minigestor-data:
