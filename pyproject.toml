[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minigestor-bd2"
version = "0.1.0"
description = "Minigestor de base de datos multimodal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "snowballstemmer>=3.0",
    "numpy>=1.26",
    "faiss-cpu>=1.9",
    "opencv-python-headless>=4.10",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]
plots = ["matplotlib>=3.8"]
postgres = ["psycopg[binary]>=3.2"]
datasets = ["pyarrow>=15"]
usearch = ["usearch>=2.20"]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "benchmarks", "demos"]
strict = true
warn_unreachable = true

# Las gráficas, la conexión a PostgreSQL y la lectura de parquet son extras opcionales. Los
# tipos de numpy, matplotlib y psycopg, y el código de librosa 1.0 (que se instala con
# Python 3.12), usan sintaxis de Python 3.12, que mypy no acepta con
# `python_version = "3.11"`; `pyarrow` y `faiss` no traen tipos. Se tratan como `Any`, y
# los módulos del motor que los usan los envuelven en funciones tipadas.
[[tool.mypy.overrides]]
module = [
    "numpy", "numpy.*", "matplotlib", "matplotlib.*", "psycopg", "psycopg.*",
    "pyarrow", "pyarrow.*", "faiss", "faiss.*", "librosa", "librosa.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# Ni el stemmer de Snowball ni libsndfile (`soundfile`) publican tipos. El analizador de
# texto y el lector de audio los envuelven en funciones tipadas, así que el resto del motor
# no ve el `Any`.
[[tool.mypy.overrides]]
module = ["snowballstemmer", "soundfile"]
ignore_missing_imports = true
