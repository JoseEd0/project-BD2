[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minigestor-bd2"
version = "0.1.0"
description = "Minigestor de base de datos multimodal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "snowballstemmer>=3.0",
    "numpy>=1.26",
    "faiss-cpu>=1.9",
    "opencv-python-headless>=4.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    # `GET /metrics` del gestor (`api.metrics`), que lee el perfil `observability`.
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
postgres = ["psycopg[binary]>=3.2"]
datasets = ["pyarrow>=15"]
usearch = ["usearch>=2.20"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27", "fakeredis>=2.26"]

# El gestor es la raíz del espacio de trabajo y cada servicio de la Parte 5 un miembro con su
# propio pyproject. Un solo uv.lock fija las versiones de todos.
[tool.uv.workspace]
members = ["apps/client", "apps/kit", "apps/shop", "apps/faces", "apps/rag", "apps/copyright"]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
# Cada servicio trae su carpeta tests/ con archivos `test_<servicio>_*.py`: pytest importa por
# nombre de archivo, y así dos servicios no chocan.
testpaths = ["tests", "apps"]
markers = [
    "anthropic: llama a la API real de Anthropic (cuesta); se salta sin RAG_ANTHROPIC_API_KEY",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "apps/*/src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
# Cada servicio de Python, por nombre: `apps/*/src` alcanzaría también `apps/web-kit/src`, que
# es TypeScript, y mypy falla en una carpeta sin archivos de Python.
files = [
    "src", "benchmarks", "demos", "tools",
    "apps/client/src", "apps/kit/src", "apps/shop/src", "apps/faces/src", "apps/rag/src",
    "apps/copyright/src",
]
strict = true
warn_unreachable = true

# Las gráficas, la conexión a PostgreSQL, la lectura de parquet y USearch son extras
# opcionales que la CI no instala. Los tipos de numpy, matplotlib y psycopg, y el código de
# librosa 1.0 (que se instala con Python 3.12), usan sintaxis de Python 3.12, que mypy no
# acepta con `python_version = "3.11"`; `pyarrow` y `faiss` no traen tipos. Se tratan como
# `Any`, y los módulos del motor que los usan los envuelven en funciones tipadas.
[[tool.mypy.overrides]]
module = [
    "numpy", "numpy.*", "matplotlib", "matplotlib.*", "psycopg", "psycopg.*",
    "pyarrow", "pyarrow.*", "faiss", "faiss.*", "librosa", "librosa.*", "usearch",
    "usearch.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# Ni el stemmer de Snowball, ni libsndfile (`soundfile`), ni onnxruntime publican tipos. El
# analizador de texto, el lector de audio, los codificadores de CLIP de la tienda y el modelo
# de embeddings del RAG los envuelven en funciones tipadas, así que el resto del código no ve
# el `Any`.
[[tool.mypy.overrides]]
module = ["snowballstemmer", "soundfile", "onnxruntime"]
ignore_missing_imports = true
